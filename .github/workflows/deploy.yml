name: Deploy to GitHub Pages

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read # needed to download release assets
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - run: npm ci

            - name: Download showcase assets from release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh release download showcase-assets \
                    --repo ${{ github.repository }} \
                    --dir public/showcase/ \
                    --pattern "scene-*" \
                    --clobber \
                  || echo "No showcase-assets release found, skipping."

            - name: Build
              env:
                  # Vite base path = /<repo>/ when deploying to a project Pages site.
                  VITE_BASE: /${{ github.event.repository.name }}/
              run: npm run build

            - name: Add SPA 404 fallback
              run: cp dist/index.html dist/404.html

            - uses: actions/configure-pages@v5
            - uses: actions/upload-pages-artifact@v3
              with:
                  path: dist

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
